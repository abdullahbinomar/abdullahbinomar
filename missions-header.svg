<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="70" viewBox="0 0 1000 70" role="img" aria-label="Active missions">
<title>Active missions</title>
<style>
.mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,'DejaVu Sans Mono',monospace} .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
@keyframes ring{0%{r:4;opacity:.9}100%{r:14;opacity:0}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes rise{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.blink{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.tw{animation:twinkle 3s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:bottom;animation:rise 2.4s ease-in-out infinite}
</style>
<rect x="0.5" y="0.5" width="999" height="69" rx="14" fill="#040405" stroke="#2a1d17"/><text x="48" y="38" class="mono" font-size="13" fill="#ff5a1f" letter-spacing="3">03 //</text><text x="100" y="38" class="mono" font-size="13" fill="#f5f3f0" letter-spacing="3">ACTIVE MISSIONS  ·  LIVE IN PRODUCTION</text><line x1="48" y1="52" x2="952" y2="52" stroke="#2a1d17"/><rect x="48" y="51" width="60" height="2" fill="#ff5a1f"><animate attributeName="x" values="48;892;48" dur="9s" repeatCount="indefinite"/></rect>
</svg>