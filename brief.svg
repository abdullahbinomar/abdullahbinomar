<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Mission brief: self-taught engineer from Lahore building software that runs businesses on its own">
<title>Mission brief: self-taught engineer from Lahore building software that runs businesses on its own</title>
<style>
.mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,'DejaVu Sans Mono',monospace} .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
@keyframes ring{0%{r:4;opacity:.9}100%{r:14;opacity:0}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes rise{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.blink{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.tw{animation:twinkle 3s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:bottom;animation:rise 2.4s ease-in-out infinite}
</style>
<rect x="0.5" y="0.5" width="999" height="299" rx="16" fill="#040405" stroke="#2a1d17"/>
<path d="M10 28 V10 H28" fill="none" stroke="#ff5a1f" stroke-width="2" opacity=".85"/>
<path d="M990 28 V10 H972" fill="none" stroke="#ff5a1f" stroke-width="2" opacity=".85"/>
<path d="M10 272 V290 H28" fill="none" stroke="#ff5a1f" stroke-width="2" opacity=".85"/>
<path d="M990 272 V290 H972" fill="none" stroke="#ff5a1f" stroke-width="2" opacity=".85"/><text x="48" y="44" class="mono" font-size="13" fill="#ff5a1f" letter-spacing="3">01 //</text><text x="100" y="44" class="mono" font-size="13" fill="#f5f3f0" letter-spacing="3">MISSION BRIEF</text><line x1="48" y1="58" x2="952" y2="58" stroke="#2a1d17"/><rect x="48" y="57" width="60" height="2" fill="#ff5a1f"><animate attributeName="x" values="48;892;48" dur="9s" repeatCount="indefinite"/></rect><text x="48" y="92" class="sans" font-size="16.5" fill="#f5f3f0">Self-taught engineer from Lahore, Pakistan. I build software that</text><text x="48" y="115" class="sans" font-size="16.5" fill="#f5f3f0">runs a business on its own: data moving between tools, customers</text><text x="48" y="138" class="sans" font-size="16.5" fill="#f5f3f0">texted at the right moment, reports that arrive without anyone</text><text x="48" y="161" class="sans" font-size="16.5" fill="#f5f3f0">making them.</text><text x="48" y="184" class="sans" font-size="16.5" fill="#c9c7c4"></text><text x="48" y="207" class="sans" font-size="16.5" fill="#c9c7c4">Right now: running PestPing, building a custom e-commerce store</text><text x="48" y="230" class="sans" font-size="16.5" fill="#c9c7c4">for a US client, and doing R&amp;D on safety tooling for AI agents.</text><text x="48" y="253" class="sans" font-size="16.5" fill="#c9c7c4">Learning in public, shipping in production.</text><rect x="640" y="64" width="322" height="206" rx="12" fill="#0b0b0d" stroke="#2a1d17"/><text x="660" y="90" class="mono" font-size="11" fill="#ff5a1f" letter-spacing="3">CREW MANIFEST</text><text x="660" y="120" class="mono" font-size="11" fill="#55575e" letter-spacing="2">CALLSIGN</text><text x="752" y="120" class="mono" font-size="12.5" fill="#f5f3f0">abdullahbinomar</text><text x="660" y="146" class="mono" font-size="11" fill="#55575e" letter-spacing="2">ROLE</text><text x="752" y="146" class="mono" font-size="12.5" fill="#f5f3f0">Full Stack AI Engineer</text><text x="660" y="172" class="mono" font-size="11" fill="#55575e" letter-spacing="2">BASE</text><text x="752" y="172" class="mono" font-size="12.5" fill="#f5f3f0">Lahore, PK · UTC+5</text><text x="660" y="198" class="mono" font-size="11" fill="#55575e" letter-spacing="2">HOURS</text><text x="752" y="198" class="mono" font-size="12.5" fill="#f5f3f0">Overlaps US + EU</text><text x="660" y="224" class="mono" font-size="11" fill="#55575e" letter-spacing="2">COMMS</text><text x="752" y="224" class="mono" font-size="12.5" fill="#f5f3f0">Python-first backends</text><text x="660" y="250" class="mono" font-size="11" fill="#55575e" letter-spacing="2">STATUS</text><text x="752" y="250" class="mono" font-size="12.5" fill="#ff5a1f">Taking select builds</text><circle cx="940" cy="246" r="4" fill="#ff5a1f" class="pulse"/>
</svg>